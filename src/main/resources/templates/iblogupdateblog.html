<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <!-- ================= CSS ================= -->

    <link rel="stylesheet"
          th:href="@{/css/utils.css}">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

    <link rel="stylesheet"
          th:href="@{/css/mobile.css}">

    <title>Update Blog - iBlog</title>

</head>


<body>


    <!-- ================= NAVIGATION ================= -->

    <nav class="navigation max-width-1 m-auto">

        <div class="nav-left">

            <!-- LOGO -->

            <a th:href="@{/}">

                <span>

                    <img
                        th:src="@{/logo.png}"
                        width="94px"
                        alt="iBlog">

                </span>

            </a>


            <!-- NAVIGATION LINKS -->

            <ul>

                <li>

                    <a th:href="@{/}">
                        Home
                    </a>

                </li>

                <li>

                    <a th:href="@{/about}">
                        About
                    </a>

                </li>

                <li>

                    <a th:href="@{/contact}">
                        Contact
                    </a>

                </li>

                <li>

                    <a th:href="@{/addBlog}">
                        Add Blog
                    </a>

                </li>

            </ul>

        </div>


        <!-- ================= SEARCH ================= -->

        <div class="nav-search">

            <form
                th:action="@{/search}"
                method="get">

                <input
                    class="form-input"
                    type="text"
                    name="query"
                    placeholder="Article Search">

                <button
                    class="btn"
                    type="submit">

                    Search

                </button>

            </form>

        </div>


        <!-- ================= LOGIN ================= -->

        <div class="nav-login">

            <a
                th:href="@{/login}"
                class="login-link">

                Sign In

            </a>

        </div>

    </nav>


    <!-- ================= DIVIDER ================= -->

    <div class="max-width-1 m-auto">

        <hr>

    </div>


    <!-- ================= UPDATE BLOG ================= -->

    <div class="contact-content max-width-1 m-auto my-2">

        <h1>
            Update Your Blog
        </h1>


        <!-- ================= UPDATE FORM ================= -->

        <form
            th:action="@{/processUpdateBlog}"
            method="post"
            enctype="multipart/form-data">


            <!-- ================= POST ID ================= -->

            <input
                type="hidden"
                name="id"
                th:value="${post.id}">


            <!-- ================= TITLE ================= -->

            <div class="form-box">

                <label for="title">
                    Blog Title
                </label>

                <input
                    class="form-input"
                    type="text"
                    id="title"
                    name="title"
                    th:value="${post.title}"
                    placeholder="Enter blog title"
                    required>

            </div>


            <!-- ================= CONTENT ================= -->

            <div class="form-box">

                <label for="content">
                    Blog Content
                </label>

                <textarea
                    class="form-input"
                    id="content"
                    name="content"
                    rows="12"
                    placeholder="Write your blog here..."
                    required
                    th:text="${post.content}"></textarea>

            </div>


            <!-- ================= CURRENT IMAGE ================= -->

            <div class="form-box">

                <label>
                    Current Blog Image
                </label>


                <!-- UPLOADED IMAGE EXISTS -->

                <img
                    th:if="${post.imageName != null and !#strings.isEmpty(post.imageName)}"
                    class="current-blog-image"
                    th:src="@{/img/blogs/{image}(image=${post.imageName})}"
                    th:alt="${post.title}"
                    style="max-width: 300px; display: block; margin: 10px 0;">


                <!-- NO IMAGE -->

                <img
                    th:unless="${post.imageName != null and !#strings.isEmpty(post.imageName)}"
                    class="current-blog-image"
                    th:src="@{/3.png}"
                    alt="iBlog"
                    style="max-width: 300px; display: block; margin: 10px 0;">

            </div>


            <!-- ================= NEW IMAGE ================= -->

            <div class="form-box">

                <label for="image">

                    Change Blog Image

                </label>


                <input
                    class="form-input"
                    type="file"
                    id="image"
                    name="image"
                    accept="image/*">


                <small>

                    Leave this empty if you want to keep
                    the current image.

                </small>

            </div>


            <!-- ================= SUBMIT ================= -->

            <div class="form-box">

                <button
                    class="btn"
                    type="submit">

                    Update Blog

                </button>

            </div>


        </form>

    </div>


    <!-- ================= FOOTER ================= -->

    <div class="footer">

        <p>
            Copyright &copy; iBlog.com
        </p>

    </div>


</body>

</html>
