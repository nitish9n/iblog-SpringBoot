<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <!-- ================= CSS ================= -->

    <link rel="stylesheet"
          th:href="@{/css/utils.css}">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

    <link rel="stylesheet"
          th:href="@{/css/mobile.css}">

    <title>iBlog - Login</title>

</head>


<body>


    <!-- ================= NAVIGATION ================= -->

    <nav class="navigation max-width-1 m-auto">

        <div class="nav-left">


            <!-- LOGO -->

            <a th:href="@{/}">

                <span>

                    <img
                        th:src="@{/logo.png}"
                        width="94px"
                        alt="iBlog">

                </span>

            </a>


            <!-- NAVIGATION LINKS -->

            <ul>

                <li>

                    <a th:href="@{/}">
                        Home
                    </a>

                </li>

                <li>

                    <a th:href="@{/about}">
                        About
                    </a>

                </li>

                <li>

                    <a th:href="@{/contact}">
                        Contact
                    </a>

                </li>

            </ul>

        </div>

    </nav>


    <!-- ================= DIVIDER ================= -->

    <div class="max-width-1 m-auto">

        <hr>

    </div>


    <!-- ================= LOGIN ================= -->

    <div class="contact-content font1 max-width-1 m-auto my-2">

        <h2>
            Login to iBlog
        </h2>


        <!-- LOGIN FORM -->

        <form
            th:action="@{/processLogin}"
            method="post">


            <!-- USERNAME -->

            <div class="form-box">

                <input
                    class="form-input"
                    type="text"
                    name="username"
                    placeholder="Enter Username"
                    required>

            </div>


            <!-- PASSWORD -->

            <div class="form-box">

                <input
                    class="form-input"
                    type="password"
                    name="password"
                    placeholder="Enter Password"
                    required>

            </div>


            <!-- LOGIN BUTTON -->

            <div class="form-box">

                <button
                    class="btn"
                    type="submit">

                    Login

                </button>

            </div>

        </form>


        <!-- SIGN UP -->

        <p>

            Don't have an account?

            <a th:href="@{/signup}">
                Sign Up
            </a>

        </p>

    </div>


    <!-- ================= FOOTER ================= -->

    <div class="footer">

        <p>
            Copyright &copy; iBlog.com
        </p>

    </div>


</body>

</html>
