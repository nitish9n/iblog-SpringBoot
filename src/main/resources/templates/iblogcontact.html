<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" th:href="@{/css/utils.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/mobile.css}">

    <title>Contact Us - iBlog</title>


    <style>

        /* =====================================================
           CONTACT PAGE
           ===================================================== */

        .contact-container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
            box-sizing: border-box;
        }


        /* =====================================================
           HEADER
           ===================================================== */

        .contact-header {
            margin-bottom: 30px;
        }

        .contact-header h1 {
            margin: 0 0 25px 0;
            font-size: 36px;
        }

        .contact-header p {
            margin: 0;
            font-size: 18px;
            line-height: 1.6;
        }


        /* =====================================================
           CONTACT FORM
           ===================================================== */

        .contact-form {
            width: 100%;
            max-width: 1000px;
            margin-top: 25px;
        }


        /* =====================================================
           FORM ROW
           ===================================================== */

        .form-row {
            display: grid;

            grid-template-columns: 100px minmax(0, 1fr);

            column-gap: 15px;

            align-items: center;

            margin-bottom: 18px;

            width: 100%;
        }


        /* =====================================================
           LABEL
           ===================================================== */

        .form-row label {
            font-size: 17px;
            font-weight: 600;
            margin: 0;
            white-space: nowrap;
        }


        /* =====================================================
           INPUT + TEXTAREA
           ===================================================== */

        .form-row input,
        .form-row textarea {

            width: 100%;

            box-sizing: border-box;

            padding: 12px;

            font-family: inherit;

            font-size: 16px;

            border: 1px solid #aaa;

            border-radius: 6px;

            background: #fff;
        }


        .form-row input {
            height: 50px;
        }


        .form-row textarea {

            min-height: 190px;

            height: 190px;

            resize: vertical;

            line-height: 1.5;
        }


        /* =====================================================
           INPUT FOCUS
           ===================================================== */

        .form-row input:focus,
        .form-row textarea:focus {

            outline: none;

            border-color: #d26900;

            box-shadow: 0 0 0 1px #d26900;
        }


        /* =====================================================
           MESSAGE ROW
           ===================================================== */

        .message-row {
            align-items: start;
        }

        .message-row label {
            padding-top: 14px;
        }


        /* =====================================================
           BUTTON ROW
           ===================================================== */

        .button-row {

            display: grid;

            grid-template-columns: 100px minmax(0, 1fr);

            column-gap: 15px;

            margin-top: 5px;
        }


        .button-container {

            display: flex;

            align-items: center;

            gap: 12px;
        }


        /* =====================================================
           SEND BUTTON
           ===================================================== */

        .submit-btn {

            border: none;

            padding: 11px 22px;

            border-radius: 5px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            background: #343a40;

            color: white;
        }


        .submit-btn:hover {
            background: #212529;
        }


        /* =====================================================
           SUCCESS POPUP
           ===================================================== */

        .success-popup {

            position: fixed;

            top: 25px;

            right: 25px;

            min-width: 300px;

            max-width: 420px;

            background: #198754;

            color: white;

            padding: 16px 20px;

            border-radius: 7px;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.20);

            display: flex;

            align-items: center;

            gap: 12px;

            z-index: 9999;

            font-size: 16px;

            font-weight: 600;

            animation:
                slideIn 0.4s ease,
                fadeOut 0.5s ease 3.5s forwards;
        }


        .success-icon {

            width: 25px;

            height: 25px;

            border-radius: 50%;

            background: white;

            color: #198754;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 16px;

            font-weight: bold;

            flex-shrink: 0;
        }


        .success-text {

            line-height: 1.4;
        }


        /* =====================================================
           SUCCESS POPUP ANIMATION
           ===================================================== */

        @keyframes slideIn {

            from {

                opacity: 0;

                transform: translateX(40px);
            }

            to {

                opacity: 1;

                transform: translateX(0);
            }
        }


        @keyframes fadeOut {

            from {

                opacity: 1;

                transform: translateX(0);
            }

            to {

                opacity: 0;

                transform: translateX(40px);

                visibility: hidden;
            }
        }


        /* =====================================================
           USER NAVIGATION
           ===================================================== */

        .user-nav {

            display: flex;

            align-items: center;

            gap: 15px;
        }


        .user-nav a {
            text-decoration: none;
        }


        .welcome-user {
            font-size: 14px;
        }


        .messages-link {
            font-weight: bold;
        }


        .logout-link {

            color: #dc3545;

            font-weight: bold;
        }


        .login-link {
            text-decoration: none;
        }


        /* =====================================================
           RESPONSIVE
           ===================================================== */

        @media screen and (max-width: 800px) {

            .contact-container {
                margin-top: 30px;
            }


            .contact-header h1 {
                font-size: 30px;
            }


            .contact-header p {
                font-size: 16px;
            }


            .contact-form {
                max-width: 100%;
            }


            .success-popup {

                left: 20px;

                right: 20px;

                top: 20px;

                min-width: auto;

                max-width: none;
            }
        }


        @media screen and (max-width: 600px) {

            .form-row {

                grid-template-columns: 1fr;

                row-gap: 7px;

                margin-bottom: 18px;
            }


            .form-row label {

                white-space: normal;
            }


            .message-row label {

                padding-top: 0;
            }


            .form-row input {

                height: 48px;
            }


            .form-row textarea {

                height: 160px;

                min-height: 160px;
            }


            .button-row {

                grid-template-columns: 1fr;
            }


            .user-nav {

                flex-direction: column;

                align-items: flex-start;

                gap: 8px;
            }
        }

    </style>

</head>


<body>


    <!-- =====================================================
         SUCCESS POPUP
         ===================================================== -->

    <div
        class="success-popup"
        id="successPopup"
        th:if="${param.success}">

        <div class="success-icon">
            ✓
        </div>

        <div class="success-text">

            Message sent successfully!

        </div>

    </div>


    <!-- =====================================================
         NAVIGATION
         ===================================================== -->

    <nav class="navigation max-width-1 m-auto">


        <!-- ================= LEFT NAVIGATION ================= -->

        <div class="nav-left">

            <a th:href="@{/}">

                <span>

                    <img
                        th:src="@{/logo.png}"
                        width="94px"
                        alt="iBlog">

                </span>

            </a>


            <ul>

                <li>

                    <a th:href="@{/}">

                        Home

                    </a>

                </li>


                <li>

                    <a th:href="@{/about}">

                        About

                    </a>

                </li>


                <li>

                    <a th:href="@{/contact}">

                        Contact

                    </a>

                </li>


                <li>

                    <a th:href="@{/addBlog}">

                        Add Blog

                    </a>

                </li>

            </ul>

        </div>


        <!-- ================= SEARCH ================= -->

        <div class="nav-search">

            <form
                th:action="@{/search}"
                method="get">

                <input
                    class="form-input"
                    type="text"
                    name="query"
                    placeholder="Article Search"
                    required>

                <button
                    class="btn"
                    type="submit">

                    Search

                </button>

            </form>

        </div>


        <!-- ================= USER NAVIGATION ================= -->

        <div class="nav-login">


            <!-- LOGGED-IN USER -->

            <div
                class="user-nav"
                th:if="${session.loggedInUser != null}">

                <span class="welcome-user">

                    Hi,

                    <span
                        th:text="${session.loggedInUser.username}">
                    </span>

                </span>


                <a
                    th:href="@{/myMessages}"
                    class="messages-link">

                    My Messages

                </a>


                <a
                    th:href="@{/logout}"
                    class="logout-link">

                    Logout

                </a>

            </div>


            <!-- NOT LOGGED IN -->

            <a
                th:unless="${session.loggedInUser != null}"
                th:href="@{/login}"
                class="login-link">

                Sign In

            </a>

        </div>

    </nav>


    <!-- =====================================================
         DIVIDER
         ===================================================== -->

    <div class="max-width-1 m-auto">

        <hr>

    </div>


    <!-- =====================================================
         CONTACT CONTAINER
         ===================================================== -->

    <div class="contact-container">


        <!-- ================= HEADER ================= -->

        <div class="contact-header">

            <h1>

                Contact Us

            </h1>

            <p>

                Have a question, suggestion, or problem?
                Send us a message and our admin will get back to you.

            </p>

        </div>


        <!-- ================= CONTACT FORM ================= -->

        <form
            class="contact-form"
            th:action="@{/processContact}"
            method="post">


            <!-- ================= NAME ================= -->

            <div class="form-row">

                <label for="name">

                    Your Name

                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    th:value="${session.loggedInUser != null ? session.loggedInUser.username : ''}"
                    required>

            </div>


            <!-- ================= EMAIL ================= -->

            <div class="form-row">

                <label for="email">

                    Email

                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required>

            </div>


            <!-- ================= SUBJECT ================= -->

            <div class="form-row">

                <label for="subject">

                    Subject

                </label>

                <input
                    type="text"
                    id="subject"
                    name="subject"
                    placeholder="Enter subject"
                    required>

            </div>


            <!-- ================= MESSAGE ================= -->

            <div class="form-row message-row">

                <label for="message">

                    Message

                </label>

                <textarea
                    id="message"
                    name="message"
                    placeholder="Write your message here..."
                    required></textarea>

            </div>


            <!-- ================= BUTTON ================= -->

            <div class="button-row">

                <div></div>

                <div class="button-container">

                    <button
                        type="submit"
                        class="submit-btn">

                        Send Message

                    </button>


                    <a
                        th:href="@{/myMessages}"
                        class="btn"
                        th:if="${session.loggedInUser != null}">

                        My Messages

                    </a>

                </div>

            </div>


        </form>

    </div>


    <!-- =====================================================
         FOOTER
         ===================================================== -->

    <div class="footer">

        <p>

            Copyright &copy; iBlog.com

        </p>

    </div>


    <!-- =====================================================
         SUCCESS POPUP SCRIPT
         ===================================================== -->

    <script>

        document.addEventListener("DOMContentLoaded", function () {

            const popup =
                document.getElementById("successPopup");


            if (popup) {

                /*
                 * Popup is automatically removed after
                 * the CSS animation finishes.
                 */

                setTimeout(function () {

                    popup.remove();

                }, 4200);


                /*
                 * Remove ?success=true from the URL
                 * after the page has loaded.
                 *
                 * This prevents the success popup from
                 * appearing again if the user refreshes.
                 */

                const url =
                    new URL(window.location.href);

                url.searchParams.delete("success");

                window.history.replaceState(
                    {},
                    document.title,
                    url.pathname +
                    (url.searchParams.toString()
                        ? "?" + url.searchParams.toString()
                        : "") +
                    url.hash
                );

            }

        });

    </script>


</body>

</html>
